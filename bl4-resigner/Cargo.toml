[package]
name = "bl4-save-resigner-gui"
version = "1.3.0"
edition = "2024"
description = "GUI for Borderlands 4 Save Data Resigner (originally by mi5hmash)"

[dependencies]
rfd = "0.17.2"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
regex = "1.0"
env_logger = "0.11.10"
tokio = { version = "1.0", features = ["full"] }
ico = "0.5.0"
egui = "0.34.1"
eframe = "0.34.1"
egui_extras = "0.34.1"
winres = "0.1.12"
aes = "0.9.0"
open = "5.3.2"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[[bin]]
name = "BL4-SR"
path = "src/main.rs"
